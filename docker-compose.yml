services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  llama-service:
    build: ./llama-service
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents
      LLM_MODEL: gpt-4o-mini
      EMBED_MODEL: text-embedding-3-small
    depends_on:
      qdrant:
        condition: service_healthy
    expose:
      - "8000"

  spring-rag-service:
    build: ./spring-rag-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SIDECAR_URL: http://llama-service:8000
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: documents
      WATCH_DIR: /data/watch
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - ./data/watch:/data/watch
    depends_on:
      llama-service:
        condition: service_healthy

volumes:
  qdrant_data:
